<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#e8553d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8553d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#3fb8af" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3fb8af" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0e1118"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#glow2)"/>
  <g transform="translate(256 262)">
    <!-- deck of cards -->
    <rect x="-112" y="-148" width="224" height="296" rx="22" fill="#3fb8af" transform="rotate(-14) translate(-14 4)"/>
    <rect x="-112" y="-148" width="224" height="296" rx="22" fill="#e8553d" transform="rotate(-5)"/>
    <g transform="rotate(5)">
      <rect x="-112" y="-148" width="224" height="296" rx="22" fill="#f5ecd9"/>
      <rect x="-112" y="-148" width="16" height="296" rx="8" fill="#f2b134"/>
      <!-- staff -->
      <g stroke="#1c1a16" stroke-width="5" stroke-opacity="0.85">
        <line x1="-78" x2="86" y1="-96" y2="-96"/>
        <line x1="-78" x2="86" y1="-48" y2="-48"/>
        <line x1="-78" x2="86" y1="0" y2="0"/>
        <line x1="-78" x2="86" y1="48" y2="48"/>
        <line x1="-78" x2="86" y1="96" y2="96"/>
      </g>
      <!-- stacked whole-note chord -->
      <g transform="translate(6 96)"><ellipse rx="36" ry="25" fill="#e8553d"/><ellipse rx="17" ry="11" transform="rotate(-50)" fill="#f5ecd9"/></g>
      <g transform="translate(6 48)"><ellipse rx="36" ry="25" fill="#1c1a16"/><ellipse rx="17" ry="11" transform="rotate(-50)" fill="#f5ecd9"/></g>
      <g transform="translate(6 0)"><ellipse rx="36" ry="25" fill="#1c1a16"/><ellipse rx="17" ry="11" transform="rotate(-50)" fill="#f5ecd9"/></g>
      <g transform="translate(6 -48)"><ellipse rx="36" ry="25" fill="#1c1a16"/><ellipse rx="17" ry="11" transform="rotate(-50)" fill="#f5ecd9"/></g>
    </g>
  </g>
</svg>
